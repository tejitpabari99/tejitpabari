name: Deploy to Firebase Hosting on merge

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  build_and_deploy:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Check — no forms in hosted /live pages
        run: npm run check:no-forms

      - name: Check — pre-launch content gate
        run: npm run check:launch

      - name: Verify VITE_GA_MEASUREMENT_ID is set
        # Fails LOUDLY here, unlike the PR workflow (§4.3) — see §4.7 for the
        # full reasoning. This is the one step that exists only in this
        # workflow, not the preview one.
        run: |
          if [ -z "${{ vars.VITE_GA_MEASUREMENT_ID }}" ]; then
            echo "::error::VITE_GA_MEASUREMENT_ID repository variable is empty or unset."
            echo "::error::A production build with no measurement ID does NOT fail — loadGa()'s"
            echo "::error::missing-ID guard (SP05 SS4.3) makes it a silent, working no-op instead."
            echo "::error::That is exactly the failure mode this check exists to catch loudly,"
            echo "::error::here, instead of quietly, in GA4, a month from now. Set it with:"
            echo "::error::  gh variable set VITE_GA_MEASUREMENT_ID --body \"G-9NLS3NG63M\""
            exit 1
          fi
          echo "VITE_GA_MEASUREMENT_ID is set."

      - name: Verify VITE_RECAPTCHA_SITE_KEY is set
        env:
          RECAPTCHA_SITE_KEY: ${{ vars.VITE_RECAPTCHA_SITE_KEY }}
        run: |
          if [ -z "$RECAPTCHA_SITE_KEY" ]; then
            echo "::error::VITE_RECAPTCHA_SITE_KEY repository variable is empty or unset."
            echo "::error::Without it the admin build skips App Check and AI calls fail in production."
            exit 1
          fi
          echo "VITE_RECAPTCHA_SITE_KEY is set."

      - name: Build all
        run: npm run build:all
        env:
          VITE_GA_MEASUREMENT_ID: ${{ vars.VITE_GA_MEASUREMENT_ID }}
          VITE_RECAPTCHA_SITE_KEY: ${{ vars.VITE_RECAPTCHA_SITE_KEY }}

      - name: Verify admin build
        run: npm run check:admin-build

      - name: Write service account credentials
        env:
          SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_TEJITPABARI_99 }}
        run: |
          umask 077
          printf '%s' "$SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/gcp-sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/gcp-sa.json" >> "$GITHUB_ENV"

      - name: Deploy hosting and firestore
        # Only runs on push to main (never a fork), see §4.8.
        run: npx firebase deploy --only hosting,firestore --project tejitpabari-99 --non-interactive --message "$GITHUB_SHA"

      - name: Remove service account credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/gcp-sa.json"
